<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="A talking board made of light. Say hello with the planchette, the candle lights, and a spirit answers." />
    <title>Spirit Board</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body class="preload">
    <main id="room" class="phase-booting intro">
      <canvas id="scene" aria-hidden="true"></canvas>
      <div class="vignette" aria-hidden="true"></div>

      <div id="stage">
        <header id="voice" title="Tap to rub out a letter">
          <p id="voice-label">Your message</p>
          <div id="voice-lines">
            <p id="ink-line" aria-live="polite"></p>
            <p id="spirit-line" aria-live="polite"></p>
          </div>
        </header>
        <div id="table" role="img" aria-label="A talking board made of light, with a planchette"></div>
        <p id="hint"></p>
      </div>

      <button id="play" type="button" aria-label="Begin the séance"></button>

      <button id="mute" type="button" aria-label="Mute sound" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path class="speaker" d="M4 9h4l5-4v14l-5-4H4z" />
          <path class="waves" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" />
          <path class="cross" d="M16 9l5 6M21 9l-5 6" />
        </svg>
      </button>

      <p id="disclaimer">For entertainment. The spirits are an AI.</p>

      <section id="endcard" hidden aria-label="The séance has ended">
        <div class="card">
          <div class="endcard-halo" aria-hidden="true"></div>
          <h2 class="endcard-name"></h2>
          <p class="endcard-epitaph"></p>
          <p class="endcard-stats"></p>
          <p class="endcard-again">Touch to summon another</p>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
